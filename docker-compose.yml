services:
  colibri-studio:
    image: python:3.12-slim
    container_name: colibri-studio
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    command: sh -c "pip install --no-cache-dir fastapi uvicorn psutil && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
